<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concert List</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div>
        <div>
          <h1 class="">Concert List</h1>
          <a th:href="@{/add-concert/}" class="bg-primary text-white btn"
            >Add Concert</a
          >
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Title</th>
                  <th>Date</th>
                  <th class="text-end" style="width: 180px">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="concert : ${concerts}">
                  <td class="fw-medium" th:text="${concert.title}">
                    Concert Title
                  </td>
                  <td th:text="${concert.date}">2026-10-16</td>
                  <td class="text-end">
                    <a
                      th:href="@{/concerts/{id}(id=${concert.id})}"
                      class="btn btn-sm btn-primary me-1"
                      >Update</a
                    >
                    <a
                      th:href="@{/delete-concert/{id}(id=${concert.id})}"
                      class="btn btn-sm btn-danger"
                      onclick="
                        return confirm(
                          'Are you sure you want to delete this concert?',
                        );
                      "
                      >Delete</a
                    >
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(concerts)}">
                  <td colspan="3" class="text-center text-muted py-4">
                    No concerts found.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  </body>
</html>
